name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Validate skills (spec + repo conventions)
        run: python3 scripts/validate_skills.py

      - name: Validate with reference skills-ref
        run: |
          pip install --quiet "skills-ref @ git+https://github.com/agentskills/agentskills#subdirectory=skills-ref"
          for d in skills/*/; do skills-ref validate "$d"; done

      - name: Test bundled scripts
        run: python3 -m unittest discover -s tests -v

      - name: Marketplace manifest is valid JSON
        run: python3 -m json.tool .claude-plugin/marketplace.json > /dev/null
