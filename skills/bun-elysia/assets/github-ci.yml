# .github/workflows/ci.yml: zero-warning gate for a Bun monorepo.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: acme_test }
        ports: ["5432:5432"]
        options: --health-cmd="pg_isready" --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/acme_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json   # or: bun-version: 1.4.x
      - run: bun install --frozen-lockfile
      - run: bunx biome ci .                        # lint + format, zero warnings
      - run: bun run typecheck                      # tsc --noEmit in every workspace
      - run: bun audit --audit-level=high           # known vulnerabilities
      - run: bun run --filter '@acme/db' db:migrate # migrations apply cleanly
      - run: bun test --parallel --coverage         # thresholds from bunfig.toml
      - run: bun run --filter '@acme/api' build     # the binary compiles
