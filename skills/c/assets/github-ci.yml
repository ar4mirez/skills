# .github/workflows/ci.yml: zero-warning gate for a C23 + CMake project.
# ubuntu-26.04 ships GCC 15 and a C23-capable clang; ubuntu-24.04's GCC 13 lacks
# <stdckdint.h> and #embed, and its default clang 18 lacks C23 constexpr.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.preset }} / ${{ matrix.cc }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        preset: [ci, ci-release]
        include:
          - { cc: clang, preset: tsan }
    env:
      CC: ${{ matrix.cc }}
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:detect_stack_use_after_return=1
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build clang
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}

  analyze:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build clang clang-tidy clang-format cppcheck
      - name: clang-format (no diff allowed)
        run: git ls-files '*.c' '*.h' | xargs clang-format --dry-run --Werror
      - name: clang-tidy
        run: |
          CC=clang cmake --preset dev
          git ls-files '*.c' | xargs clang-tidy -p build/dev --quiet
      - name: GCC -fanalyzer (a one-off cache flag, not project policy)
        run: |
          CC=gcc cmake -S . -B build/analyzer -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS=-fanalyzer -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          cmake --build build/analyzer
      - name: cppcheck
        run: cppcheck --project=build/dev/compile_commands.json --enable=warning,portability --error-exitcode=1 --inline-suppr -i build

  fuzz:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build clang
      - run: cmake --preset fuzz && cmake --build --preset fuzz
      - name: fuzz for 60 seconds
        run: |
          mkdir -p corpus
          ./build/fuzz/fuzz_parse corpus -max_total_time=60 -max_len=4096
