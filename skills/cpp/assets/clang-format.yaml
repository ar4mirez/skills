# Google base, 100 columns. Formatting is not a debate: CI runs clang-format --dry-run -Werror.
BasedOnStyle: Google
Language: Cpp
Standard: Latest
ColumnLimit: 100
DerivePointerAlignment: false
PointerAlignment: Left
IncludeBlocks: Regroup
IncludeCategories:
  - Regex: '^<[a-z_]+>$'        # C++ standard library
    Priority: 1
  - Regex: '^<.*\.h>$'          # C and system headers
    Priority: 2
  - Regex: '^<.*>$'             # third-party
    Priority: 3
  - Regex: '^".*"$'             # this project
    Priority: 4
