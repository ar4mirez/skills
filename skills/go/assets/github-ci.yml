# .github/workflows/ci.yml: zero-warning gate for a Go module.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: links_test }
        ports: ["5432:5432"]
        options: --health-cmd="pg_isready" --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/links_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go mod tidy -diff                 # go.mod/go.sum are tidy
      - run: go vet ./...
      - run: go fix -diff ./...                # modernizers have nothing left to rewrite
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
      - run: go tool govulncheck ./...         # pinned by the tool directive in go.mod
      - name: sqlc output is current
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 diff
      - run: go test -race -shuffle=on -coverprofile=cover.out ./...   # -race needs cgo: don't set CGO_ENABLED=0 here
      - name: static release build
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /dev/null ./cmd/links
