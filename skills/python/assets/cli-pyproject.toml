[project]
name = "acme-cli"
version = "0.1.0"
description = "Command-line tools for acme short links."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = ["acme-core", "typer>=0.27.2"]

[project.scripts]
acme = "acme_cli.main:app"

[tool.uv.sources]
acme-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.18,<0.13"]
build-backend = "uv_build"
