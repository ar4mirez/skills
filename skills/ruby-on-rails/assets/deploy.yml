# config/deploy.yml (Kamal 2). Replace every <placeholder>.
service: <app_name>
image: <github_user>/<app_name>

servers:
  web:
    - <server_ip>
  # Add a dedicated job role once job load justifies it, and set
  # SOLID_QUEUE_IN_PUMA to false below:
  # job:
  #   hosts:
  #     - <server_ip>
  #   cmd: bin/jobs

proxy:
  host: <app.example.com>
  ssl: true                          # Let's Encrypt (single host, no Cloudflare proxying)
  # Behind Cloudflare (Full strict) or with multiple web hosts, use a Cloudflare Origin CA cert:
  # ssl:
  #   certificate_pem: CERTIFICATE_PEM
  #   private_key_pem: PRIVATE_KEY_PEM
  # forward_headers: true            # keep X-Forwarded-* (pair with the cloudflare-rails gem)

registry:
  # Kamal 2.8+ can deploy without a remote registry for single-host setups.
  # Use GHCR once you have multiple hosts or deploy from CI:
  server: ghcr.io
  username: <github_user>
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    - DATABASE_PASSWORD
    - SENTRY_DSN
  clear:
    SOLID_QUEUE_IN_PUMA: true       # run jobs inside Puma until a job role exists
    WEB_CONCURRENCY: 2              # Puma workers ≈ cores
    RAILS_MAX_THREADS: 3
    DB_HOST: <app_name>-db
    RAILS_LOG_TO_STDOUT: true

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"

volumes:
  - "<app_name>_storage:/rails/storage"   # Active Storage disk / SQLite files

asset_path: /rails/public/assets

builder:
  arch: amd64

accessories:
  db:
    image: postgres:17
    host: <server_ip>
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: <app_name>
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data

# .kamal/secrets (Rails 8.1 can read secrets from encrypted credentials):
#   KAMAL_REGISTRY_PASSWORD=$(bin/rails credentials:fetch kamal.registry_password)
#   RAILS_MASTER_KEY=$(cat config/master.key)
#   DATABASE_PASSWORD=$(bin/rails credentials:fetch database.password)
#   POSTGRES_PASSWORD=$DATABASE_PASSWORD
