# cargo-deny: supply-chain gate. Run `cargo deny check` locally and in CI.
# Docs: https://embarkstudios.github.io/cargo-deny/
[graph]
# Check only the platforms you ship; add targets as you add platforms.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "aarch64-apple-darwin"]
all-features = true

[advisories]
# RustSec database: vulnerabilities, unmaintained, and yanked crates fail the build.
# Every ignore needs an id, a reason, and an owner, and should expire.
ignore = []

[licenses]
# Permissive licenses only; anything else needs an explicit, reviewed exception.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[licenses.private]
# Unpublished workspace crates (publish = false) aren't license-checked.
ignore = true

[bans]
multiple-versions = "warn"   # duplicates cost compile time; review, don't block
wildcards = "deny"           # no `*` requirements
allow-wildcard-paths = true  # workspace path deps (publish = false) have no version
workspace-default-features = "allow"
external-default-features = "allow"
deny = [
  # OpenSSL: we use rustls. Blocking it keeps images static-friendly and the build C-free.
  { name = "openssl-sys", reason = "use rustls" },
  { name = "native-tls", reason = "use rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
