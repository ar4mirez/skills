[package]
name = "shop-api"
version = "0.1.0"
edition = "2021"

[dependencies]
shop-core = { path = "../core" }
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
openssl = "0.10"
serde.workspace = true
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "macros"] }
tokio = { version = "1", features = ["full"] }
